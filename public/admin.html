<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — ЗаВози</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --bg-elevated: #222228;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --accent: #FFC107;
            --accent-hover: #e0a800;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --font: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font);
            line-height: 1.5;
            min-height: 100vh;
        }
        .hidden { display: none !important; }

        /* ---------- Логин ---------- */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .login-box h1 {
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-box .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: var(--text-main);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #121214;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-box button:hover { background: var(--accent-hover); }
        .login-box button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }

        /* ---------- Дашборд ---------- */
        .dashboard {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .topbar h1 {
            font-size: 22px;
        }
        .topbar h1 .accent { color: var(--accent); }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: var(--text-main);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { background: rgba(255,255,255,0.06); }
        .btn-accent {
            background: var(--accent);
            color: #121214;
            border-color: var(--accent);
        }
        .btn-accent:hover { background: var(--accent-hover); }
        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.1); }

        /* ---------- Статистика ---------- */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .stat-box .num {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-box .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ---------- Таблица ---------- */
        .table-wrap {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead {
            background: rgba(255,255,255,0.03);
        }
        th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: middle;
        }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody tr:last-child td { border-bottom: none; }

        .tariff-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255,193,7,0.1);
            color: var(--accent);
        }
        .route {
            max-width: 250px;
        }
        .route .from, .route .to {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .route .to {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 2px;
        }
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-new { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status-confirmed { background: rgba(16,185,129,0.15); color: var(--success); }
        .status-done { background: rgba(160,160,171,0.15); color: var(--text-muted); }
        .status-cancelled { background: rgba(239,68,68,0.15); color: var(--danger); }

        .actions {
            display: flex;
            gap: 6px;
        }
        .actions select, .actions button {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-elevated);
            color: var(--text-main);
            font-family: var(--font);
            cursor: pointer;
        }
        .actions select:focus { outline: none; border-color: var(--accent); }
        .actions .del {
            color: var(--danger);
            border-color: rgba(239,68,68,0.3);
        }
        .actions .del:hover { background: rgba(239,68,68,0.1); }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .refresh-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЛОГИНА -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>Вход в админку</h1>
            <p class="subtitle">Сервис трансфера «ЗаВози»</p>
            <form id="loginForm">
                <input type="text" id="loginInput" placeholder="Логин" autocomplete="username" required>
                <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password" required>
                <button type="submit" id="loginBtn">Войти</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- ДАШБОРД -->
    <div id="dashboard" class="dashboard hidden">
        <div class="topbar">
            <h1>Заявки <span class="accent">ЗаВози</span></h1>
            <div class="topbar-right">
                <span id="adminName"></span>
                <button class="btn" id="refreshBtn">Обновить</button>
                <button class="btn btn-danger" id="logoutBtn">Выйти</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="num" id="statTotal">0</div>
                <div class="label">Всего</div>
            </div>
            <div class="stat-box">
                <div class="num" id="statNew">0</div>
                <div class="label">Новые</div>
            </div>
            <div class="stat-box">
                <div class="num" id="statConfirmed">0</div>
                <div class="label">Подтверждены</div>
            </div>
            <div class="stat-box">
                <div class="num" id="statDone">0</div>
                <div class="label">Выполнены</div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Тариф</th>
                        <th>Маршрут</th>
                        <th>Дата / Время</th>
                        <th>Телефон</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="bookingsBody"></tbody>
            </table>
            <div id="emptyState" class="empty hidden">Заявок пока нет</div>
        </div>
        <div class="refresh-info" id="refreshInfo"></div>
    </div>

    <script>
    // =========================================================================
    // СОСТОЯНИЕ
    // =========================================================================
    const state = { bookings: [] };
    const TARIFF_LABELS = {
        airport: 'Аэропорт',
        city: 'По городу',
        intercity: 'Межгород'
    };
    const STATUS_LABELS = {
        new: 'Новая',
        confirmed: 'Подтверждена',
        done: 'Выполнена',
        cancelled: 'Отменена'
    };

    // =========================================================================
    // УТИЛИТЫ
    // =========================================================================
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
    }

    function formatDateTime(date, time) {
        if (!date) return '—';
        return `${escapeHtml(date)} ${escapeHtml(time || '')}`.trim();
    }

    // =========================================================================
    // ЛОГИН / ЛОГАУТ
    // =========================================================================
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    async function checkAuth() {
        try {
            const res = await fetch('/api/admin/me');
            if (res.ok) {
                const data = await res.json();
                showDashboard(data.login);
            } else {
                showLogin();
            }
        } catch {
            showLogin();
        }
    }

    function showLogin() {
        loginScreen.classList.remove('hidden');
        dashboard.classList.add('hidden');
    }

    async function showDashboard(login) {
        loginScreen.classList.add('hidden');
        dashboard.classList.remove('hidden');
        document.getElementById('adminName').textContent = '👤 ' + login;
        await loadBookings();
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.textContent = '';
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вход...';

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: document.getElementById('loginInput').value.trim(),
                    password: document.getElementById('passwordInput').value
                })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                throw new Error(data.error || 'Ошибка входа');
            }

            document.getElementById('passwordInput').value = '';
            await showDashboard(document.getElementById('loginInput').value.trim());
        } catch (err) {
            loginError.textContent = err.message;
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/admin/logout', { method: 'POST' });
        state.bookings = [];
        showLogin();
    });

    // =========================================================================
    // ЗАГРУЗКА И РЕНДЕР ЗАЯВОК
    // =========================================================================
    const bookingsBody = document.getElementById('bookingsBody');
    const emptyState = document.getElementById('emptyState');
    const refreshInfo = document.getElementById('refreshInfo');

    async function loadBookings() {
        try {
            const res = await fetch('/api/bookings');
            if (res.status === 401) {
                showLogin();
                return;
            }
            const data = await res.json();
            if (!data.success) throw new Error(data.error);

            state.bookings = data.data;
            renderBookings();
            renderStats();
            refreshInfo.textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
        } catch (err) {
            console.error(err);
            refreshInfo.textContent = 'Ошибка загрузки: ' + err.message;
        }
    }

    function renderStats() {
        const total = state.bookings.length;
        const count = s => state.bookings.filter(b => b.status === s).length;
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statNew').textContent = count('new');
        document.getElementById('statConfirmed').textContent = count('confirmed');
        document.getElementById('statDone').textContent = count('done');
    }

    function renderBookings() {
        bookingsBody.innerHTML = '';

        if (state.bookings.length === 0) {
            emptyState.classList.remove('hidden');
            return;
        }
        emptyState.classList.add('hidden');

        state.bookings.forEach(b => {
            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${b.id}</td>
                <td><span class="tariff-tag">${TARIFF_LABELS[b.tariff] || escapeHtml(b.tariff)}</span></td>
                <td class="route">
                    <span class="from">${escapeHtml(b.route_from)}</span>
                    <span class="to">→ ${escapeHtml(b.route_to)}</span>
                </td>
                <td>${formatDateTime(b.date, b.time)}</td>
                <td>${escapeHtml(b.phone)}</td>
                <td><span class="status status-${b.status}">${STATUS_LABELS[b.status] || b.status}</span></td>
                <td>
                    <div class="actions">
                        <select data-id="${b.id}" class="status-select">
                            ${Object.entries(STATUS_LABELS).map(([val, label]) =>
                                `<option value="${val}" ${val === b.status ? 'selected' : ''}>${label}</option>`
                            ).join('')}
                        </select>
                        <button class="del" data-id="${b.id}">Удалить</button>
                    </div>
                </td>
            `;

            // Смена статуса
            tr.querySelector('.status-select').addEventListener('change', async (e) => {
                const id = e.target.dataset.id;
                const status = e.target.value;
                try {
                    const res = await fetch(`/api/bookings/${id}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error);

                    // Обновляем локально
                    const booking = state.bookings.find(x => x.id == id);
                    if (booking) booking.status = status;
                    renderStats();
                    renderBookings();
                } catch (err) {
                    alert('Ошибка: ' + err.message);
                    loadBookings();
                }
            });

            // Удаление
            tr.querySelector('.del').addEventListener('click', async (e) => {
                const id = e.target.dataset.id;
                if (!confirm(`Удалить заявку #${id}?`)) return;

                try {
                    const res = await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error);

                    state.bookings = state.bookings.filter(x => x.id != id);
                    renderBookings();
                    renderStats();
                } catch (err) {
                    alert('Ошибка: ' + err.message);
                }
            });

            bookingsBody.appendChild(tr);
        });
    }

    // =========================================================================
    // КНОПКА ОБНОВИТЬ + АВТООБНОВЛЕНИЕ КАЖДЫЕ 30 СЕК
    // =========================================================================
    document.getElementById('refreshBtn').addEventListener('click', loadBookings);

    setInterval(() => {
        if (!dashboard.classList.contains('hidden')) {
            loadBookings();
        }
    }, 30000);

    // =========================================================================
    // СТАРТ
    // =========================================================================
    checkAuth();
    </script>
</body>
</html>
